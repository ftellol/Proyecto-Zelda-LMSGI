<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hyrule Encyclopedia</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<header class="cabecera">
    <img src="assets/images/Logo_zelda.png" alt="Logo Zelda" class="logo-zelda">
    <a href="index.html" class="boton-header">Inicio</a>
</header>

<main>
    <section class="introduccion">
        <h1>Favoritos de Hyrule</h1>
        <p>Tus personajes, criaturas y lugares favoritos guardados en la nube.</p>
    </section>

    <section class="controles-favoritos">
        <label for="filtro-tipo">Filtrar por tipo:
            <select id="filtro-tipo">
                <option value="todos">Todos</option>
                <option value="characters">Personajes</option>
                <option value="monsters">Monstruos</option>
                <option value="bosses">Jefes</option>
                <option value="places">Lugares</option>
            </select>
        </label>
        <label for="orden-favoritos">Ordenar por:
            <select id="orden-favoritos">
                <option value="fecha-desc">Más reciente</option>
                <option value="fecha-asc">Más antiguo</option>
                <option value="nombre-asc">Nombre A-Z</option>
                <option value="nombre-desc">Nombre Z-A</option>
            </select>
        </label>
        <button id="btn-vaciar" class="boton-peligro">Vaciar lista</button>
    </section>

    <section id="lista-favoritos" class="contenedor-favoritos"></section>
</main>

<footer>
    <p class="copyright">Hyrule Encyclopedia&copy;. Todos los derechos reservados.</p>
    <p class="creditos">Diseñado y desarrollado por Fabio Tello - 1º DAW</p>
</footer>

<script type="module" src="js/ui.js"></script>

</body>
</html>
