<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hyrule Encyclopedia</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<header class="cabecera">
    <img src="assets/images/Logo_zelda.png" alt="Logo de Zelda" class="logo-zelda">
    <p>⭐ Favoritos</p>
</header>

<main>
    <h1>Hyrule Encyclopedia - The Legend of Zelda</h1>
    <p>Explora el universo de The Legend of Zelda. Busca personajes, monstruos, lugares y más.</p>

    <section class="seccion_buscador">
        <form class="buscador">
            <select id="tipo">
                <option value="characters">Personajes</option>
                <option value="monsters">Monstruos</option>
                <option value="Bosses">Jefes</option>
                <option value="Staff">Staff</option>
                <option value="Dungeons">Dungeons</option>
                <option value="Places">Lugares</option>
                <option value="Items">Objetos</option>
                <option value="Games">Juegos</option>
            </select>
            <input type="text" placeholder="Buscar la trifuerza...">
        </form>
    </section>
</main>

<footer>
    <p class="copyright">Hyrule Encyclopedia&copy; P. Todos los derechos reservados.</p>
    <p class="creditos">Diseñado y desarrollado por Fabio Tello - 1º DAW</p>
</footer>

</body>
</html>
